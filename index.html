<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レザー参考ストック</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5b3a29">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="レザー参考">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#f6f1ea;--card:#fff;--ink:#2b211b;--sub:#8a7a6d;--line:#e6dccf;--brown:#5b3a29;--tan:#c08a5b;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:16px 16px 8px;border-bottom:1px solid var(--line)}
h1{font-size:20px;letter-spacing:.02em}
.count{color:var(--sub);font-size:13px;margin-top:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--brown);border-color:var(--brown);color:#fff}
.card{position:relative}
.fav{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.88);font-size:19px;line-height:34px;text-align:center;color:#b9aa9a;cursor:pointer;padding:0;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.fav.on{color:#e0a100}
.favbig{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;color:var(--ink);margin-bottom:8px}
.favbig.on{border-color:#e0a100;background:#fff8e1}
main{padding:14px 12px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;max-width:1100px;margin:0 auto}
.card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(60,40,20,.08);cursor:pointer;display:flex;flex-direction:column}
.card img.ill{object-fit:contain;background:#efe6da}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#eee}
.cb{padding:10px 10px 12px}
.no{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.nm{font-size:14px;font-weight:600;line-height:1.35;margin:2px 0 6px}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px}
.tag{background:#f1e8dc;color:var(--brown);border-radius:6px;padding:2px 6px}
.lv{color:var(--tan)}
.st{border-radius:6px;padding:2px 6px;color:#fff}
.st-候補{background:#9a8b7d}.st-型紙中{background:#c08a5b}.st-製作中{background:#b5552e}.st-完成{background:#4f7a4a}.st-保留{background:#bbb}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:40px 0}
.ov{position:fixed;inset:0;background:rgba(30,20,10,.5);display:none;z-index:10;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0}
.sheet img{width:100%;display:block;background:#eee}
.sb{padding:16px 18px 28px}
.sb h2{font-size:19px;margin:4px 0 10px;line-height:1.35}
.row{padding:10px 0;border-top:1px solid var(--line)}
.row b{display:block;font-size:11px;color:var(--sub);font-weight:600;margin-bottom:3px}
.row p{font-size:14px;line-height:1.6}
.close{position:sticky;top:0;float:right;margin:10px;width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.9);font-size:18px;cursor:pointer;z-index:2}
footer{text-align:center;font-size:12px;color:var(--sub);padding:0 0 30px}
footer a{color:var(--brown)}
.act{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:4px 0 10px}
.act b{display:block;font-size:11px;color:var(--sub);margin-bottom:6px}
.act .btns{display:flex;flex-wrap:wrap;gap:6px}
.act a{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink);text-decoration:none;background:#fff}
.act a.cur{background:var(--brown);border-color:var(--brown);color:#fff}
.act a.fix{display:block;text-align:center;margin-top:10px;background:#b5552e;border-color:#b5552e;color:#fff;border-radius:8px;padding:8px}
.act .note{font-size:11px;color:var(--sub);margin-top:8px;line-height:1.5}
.pend{display:inline-block;font-size:10px;background:#b5552e;color:#fff;border-radius:4px;padding:1px 5px;margin-left:4px}

.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:#eee}
.gal img{flex:none;width:100%;scroll-snap-align:start;aspect-ratio:1/1;object-fit:cover}
.gal img.ill{object-fit:contain;background:#efe6da}
.galnote{font-size:10px;color:var(--sub);text-align:right;padding:3px 8px}
.pat{background:#fffdf9;border:1px solid var(--line);border-radius:10px;margin:6px 0 8px;overflow:hidden}
.pat img{width:100%;display:block;background:#fffdf9}
.pat a{display:block;text-align:center;font-size:12px;color:var(--brown);padding:6px 0 8px;text-decoration:none}
table.parts{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
table.parts th,table.parts td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
table.parts th{font-size:11px;color:var(--sub);font-weight:600}
.badge{display:inline-block;font-size:10px;background:var(--brown);color:#fff;border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:middle}
</style>
</head>
<body>
<header>
  <div style="display:flex;justify-content:space-between;align-items:center"><h1>レザー参考ストック</h1><button id="gear" aria-label="設定" style="border:none;background:none;font-size:20px;cursor:pointer;color:var(--sub)">⚙</button></div>
  <div class="count" id="count"></div>
  <div class="chips" id="typeChips"></div>
  <div class="chips" id="stChips"></div>
</header>
<main id="grid"></main>
<footer><a href="https://docs.google.com/spreadsheets/d/1hX1OshrNN4mnmZMkyNSMUsmfCmgTOIlAwgLEgvFBxpU/edit">スプシで開く</a></footer>
<div class="ov" id="setov" style="z-index:15"><div class="sheet" style="padding:18px 18px 28px">
 <h2 style="font-size:17px;margin-bottom:8px">ワンタップ更新の設定（最初の1回だけ）</h2>
 <p id="setWhy" style="font-size:13px;line-height:1.7;color:var(--ink)">これを1回やっておくと、ステータスも型紙修正もボタン1つでその場で反映されます。</p>
 <ol style="font-size:13px;line-height:1.9;margin:10px 0 12px 18px;color:var(--ink)">
  <li>下の「作成ページを開く」を押す（名前と権限は入力済み）</li>
  <li>Repository access で <b>Only select repositories</b> → <b>leather-stock</b> を選んで、一番下の <b>Generate token</b></li>
  <li>出てきた文字（github_pat_…）をコピーしてこの画面に戻り、「貼り付けて保存」</li>
 </ol>
 <a id="tokNew" href="https://github.com/settings/personal-access-tokens/new?name=leather-stock-app&description=%E3%83%AC%E3%82%B6%E3%83%BC%E5%8F%82%E8%80%83%E3%82%B9%E3%83%88%E3%83%83%E3%82%AF%E3%81%AE%E3%82%A2%E3%83%97%E3%83%AA%E3%81%8B%E3%82%89%E6%9B%B4%E6%96%B0&target_name=takumij527-a11y&expires_in=none&contents=write&issues=write" target="_blank" rel="noopener" class="chip" style="display:block;text-align:center;padding:11px;text-decoration:none">① 作成ページを開く</a>
 <button id="tokPaste" class="chip on" style="width:100%;margin-top:8px;padding:11px">③ 貼り付けて保存</button>
 <details style="margin-top:10px;font-size:12.5px;color:var(--sub)"><summary>貼り付けがうまくいかないとき</summary>
 <input id="tok" type="password" placeholder="github_pat_..." autocomplete="off" style="width:100%;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px">
 <button id="tokSave" class="chip" style="width:100%;margin-top:6px;padding:9px">入力した文字で保存</button></details>
 <div style="display:flex;gap:8px;margin-top:10px"><button id="tokDel" class="chip" style="flex:1;padding:10px">トークンを削除</button><button id="setClose" class="chip" style="flex:1;padding:10px">閉じる</button></div>
 <p id="tokState" style="font-size:12px;color:var(--sub);margin-top:10px"></p>
</div></div>
<div id="toast" style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b211b;color:#fff;font-size:13px;padding:10px 16px;border-radius:999px;display:none;z-index:20"></div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<script>
const TYPES=["すべて","バッグ","財布・小物","収納・トレー","構造・展開図","TIPS"];
const STS=["すべて","候補","型紙中","製作中","完成","保留"];
const FAVF="★お気に入り";
let data=[],fType="すべて",fSt="すべて";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function chips(el,list,cur,set){
  el.innerHTML=list.map(t=>`<button class="chip${t===cur?" on":""}" data-v="${esc(t)}">${esc(t)}</button>`).join("");
  el.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{set(b.dataset.v);render();});
}
function render(){
  chips(document.getElementById("typeChips"),TYPES,fType,v=>fType=v);
  chips(document.getElementById("stChips"),[STS[0],FAVF,...STS.slice(1)],fSt,v=>fSt=v);
  const list=data.filter(d=>(fType==="すべて"||d.type===fType)&&(fSt==="すべて"||(fSt===FAVF?isFav(d):eff(d)===fSt))).sort((a,b)=>b.no.localeCompare(a.no));
  document.getElementById("count").textContent=`${list.length}件 / 全${data.length}件`;
  const g=document.getElementById("grid");
  g.innerHTML=list.length?list.map(d=>`<div class="card" data-no="${esc(d.no)}"><button class="fav${isFav(d)?" on":""}" data-fav="${esc(d.no)}" aria-label="お気に入り">${isFav(d)?"★":"☆"}</button>
    ${d.photos&&d.photos.length?`<img src="${esc(d.photos[0])}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.className='ill';this.src='${esc(d.img||"")}'">`:`<img src="${esc(d.img||`img/${d.no}.jpg`)}" alt="" loading="lazy" class="${d.img?"ill":""}">`}
    <div class="cb"><div class="no">No.${esc(d.no)}</div><div class="nm">${esc(d.name)}</div>
    <div class="meta"><span class="tag">${esc(d.type)}</span><span class="lv">${esc(d.level)}</span><span class="st st-${esc(eff(d))}">${esc(eff(d))}</span>${d.pattern?'<span class="badge">型紙</span>':""}${(pendFor(d)||{}).fix||((pendFor(d)||{}).status&&!getTok())?'<span class="pend">反映待ち</span>':""}</div></div></div>`).join("")
    :`<div class="empty">該当なし</div>`;
  g.querySelectorAll(".card").forEach(c=>c.onclick=()=>open(c.dataset.no));
  g.querySelectorAll(".fav").forEach(b=>b.onclick=ev=>{ev.stopPropagation();toggleFav(b.dataset.fav)});
}
const REPO="takumij527-a11y/leather-stock";
const PKEY="leatherstock-pending";
function getPend(){try{return JSON.parse(localStorage.getItem(PKEY)||"{}")}catch(e){return {}}}
function setPend(p){try{localStorage.setItem(PKEY,JSON.stringify(p))}catch(e){}}
function issueUrl(label,title,body){return `https://github.com/${REPO}/issues/new?labels=${encodeURIComponent(label)}&title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`}
function pendFor(d){const p=getPend()[d.no];if(!p)return null;
  if(p.status&&p.status===d.status)delete p.status;
  if(p.fix&&d.reviewed&&d.reviewed>=p.fix)delete p.fix;
  return (p.status||p.fix)?p:null}
const TKEY="leatherstock-token";
function getTok(){try{return localStorage.getItem(TKEY)||""}catch(e){return ""}}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.style.display="block";clearTimeout(toast._t);toast._t=setTimeout(()=>el.style.display="none",2600)}
const FKEY="leatherstock-fav";
function getFav(){try{return JSON.parse(localStorage.getItem(FKEY)||"{}")}catch(e){return {}}}
function setFav(m){try{localStorage.setItem(FKEY,JSON.stringify(m))}catch(e){}}
function isFav(d){const m=getFav();if(d.no in m){if(m[d.no]===!!d.fav){delete m[d.no];setFav(m)}else return m[d.no]}return !!d.fav}
let favQ=Promise.resolve();
function toggleFav(no){
  const d=data.find(x=>x.no===no);if(!d)return;
  const v=!isFav(d);const m=getFav();m[no]=v;setFav(m);
  render();if(document.getElementById("ov").classList.contains("show")&&document.getElementById("ov").dataset.no===no){const b=document.getElementById("favbig");if(b){const f=isFav(d);b.classList.toggle("on",f);b.textContent=f?"★ お気に入り":"☆ お気に入りに追加"}}
  toast(v?"お気に入りに追加":"お気に入りから外しました");
  if(getTok())favQ=favQ.then(()=>setFavDirect(d,v)).catch(e=>toast("同期できませんでした（この端末には保存済み）"));
}
async function setFavDirect(d,v){
  for(let attempt=0;attempt<2;attempt++){
    const f=await gh("/contents/data.json?ref=main");
    const txt=b64dec(f.content);
    const i=txt.indexOf('"no": "'+d.no+'"'); if(i<0)throw new Error("No."+d.no+"が見つからない");
    const nx=txt.indexOf('"no": "',i+5); const j=txt.indexOf('"fav": ',i);
    if(j<0||(nx>0&&j>nx))throw new Error("favなし");
    const k=txt.indexOf(v?"false":"true",j); const cur=txt.slice(j+7,j+7+(txt[j+7]==="t"?4:5));
    if(cur===String(v))return;
    const next=txt.slice(0,j+7)+String(v)+txt.slice(j+7+cur.length);
    try{await gh("/contents/data.json",{method:"PUT",body:JSON.stringify({message:`お気に入り ${d.no} ${v?"追加":"解除"}（アプリから）`,content:b64enc(next),sha:f.sha,branch:"main"})});d.fav=v;return}
    catch(e){if(!String(e.message).startsWith("409")||attempt)throw e}
  }
}
function eff(d){const p=pendFor(d);return (p&&p.status)||d.status}
function b64dec(s){const bin=atob(s.replace(/\n/g,""));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
function b64enc(str){const u=new TextEncoder().encode(str);let bin="";for(let i=0;i<u.length;i+=8192)bin+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(bin)}
async function gh(path,opt={}){const r=await fetch("https://api.github.com/repos/"+REPO+path,Object.assign({},opt,{headers:Object.assign({"Authorization":"Bearer "+getTok(),"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},opt.headers||{})}));if(!r.ok){const t=await r.text();throw new Error(r.status+" "+t.slice(0,120))}return r.json()}
async function setStatusDirect(d,s){
  for(let attempt=0;attempt<2;attempt++){
    const f=await gh("/contents/data.json?ref=main");
    const txt=b64dec(f.content);
    const i=txt.indexOf('"no": "'+d.no+'"'); if(i<0)throw new Error("No."+d.no+"が見つからない");
    const j=txt.indexOf('"status": "',i); const k=txt.indexOf('"',j+11);
    const next=txt.slice(0,j)+'"status": "'+s+txt.slice(k);
    try{await gh("/contents/data.json",{method:"PUT",body:JSON.stringify({message:`ステータス変更 ${d.no} → ${s}（アプリから）`,content:b64enc(next),sha:f.sha,branch:"main"})});return}
    catch(e){if(!String(e.message).startsWith("409")||attempt)throw e}
  }
}
function actions(d){
  const p=pendFor(d)||{}, tok=getTok(), cur=eff(d);
  const btns=STS.slice(1).map(s=>`<a href="#" data-st="${s}" class="${s===cur?"cur":""}">${s}</a>`).join("");
  const fixUI=tok
    ?`<a class="fix" href="#" data-fixopen="1">型紙の修正が必要</a><div id="fixbox" style="display:none;margin-top:8px"><textarea id="fixtxt" rows="3" placeholder="どこを直す？（例：底の三角はいらない）" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:13px"></textarea><button id="fixsend" class="chip on" style="width:100%;margin-top:6px;padding:9px">送る（次の定期更新で最優先）</button></div>`
    :`<a class="fix" href="#" data-needset="1">型紙の修正が必要</a>`;
  let note=tok?"ステータスは押すとすぐ保存されます。":"最初の1回だけ設定が必要です（押すと設定画面が開きます）。";
  if(p.fix)note="型紙の修正を依頼済み（反映待ち）。"+note;
  else if(p.status&&!tok)note=`「${p.status}」に変更を依頼済み（反映待ち）。`+note;
  return `<div class="act"><b>ステータスを変える</b><div class="btns">${btns}</div>${fixUI}<div class="note">${esc(note)}</div></div>`;
}
function bindActions(d){
  const tok=getTok();
  document.querySelectorAll(".act a[data-st]").forEach(a=>a.addEventListener("click",async ev=>{
    const s=a.dataset.st;
    ev.preventDefault(); if(!tok){openSetup("設定が終わったら、もう一度ステータスのボタンを押してください。");return} if(s===eff(d))return;
    document.querySelectorAll(".act a[data-st]").forEach(x=>x.classList.toggle("cur",x===a));
    try{await setStatusDirect(d,s);const p=getPend();p[d.no]=Object.assign(p[d.no]||{},{status:s});setPend(p);toast(`「${s}」に変更しました`);open(d.no);render()}
    catch(e){toast("保存できませんでした："+e.message.slice(0,40));open(d.no)}
  }));
  const f=document.querySelector(".act a[data-needset]"); if(f)f.addEventListener("click",ev=>{ev.preventDefault();openSetup("設定が終わったら、もう一度「型紙の修正が必要」を押してください。")});
  const fo=document.querySelector(".act a[data-fixopen]"); if(fo)fo.addEventListener("click",ev=>{ev.preventDefault();const b=document.getElementById("fixbox");b.style.display=b.style.display==="none"?"block":"none";if(b.style.display==="block")document.getElementById("fixtxt").focus()});
  const fs=document.getElementById("fixsend"); if(fs)fs.addEventListener("click",async()=>{
    const t=document.getElementById("fixtxt").value.trim(); if(!t){toast("どこを直すか書いてね");return}
    fs.disabled=true;
    try{await gh("/issues",{method:"POST",body:JSON.stringify({title:`[型紙修正] ${d.no} ${d.name}`,body:`No: ${d.no}\n\n## どこを直す？\n${t}\n`,labels:["型紙修正"]})});
      const p=getPend();p[d.no]=Object.assign(p[d.no]||{},{fix:new Date().toISOString().slice(0,10)});setPend(p);toast("修正依頼を送りました");open(d.no);render()}
    catch(e){fs.disabled=false;toast("送れませんでした："+e.message.slice(0,40))}
  });
}
function open(no){
  const d=data.find(x=>x.no===no); if(!d)return;
  document.getElementById("ov").dataset.no=no;
  const r=(k,v)=>v?`<div class="row"><b>${k}</b><p>${esc(v)}</p></div>`:"";
  document.getElementById("sheet").innerHTML=`<button class="close" id="cl">×</button>
   ${gallery(d)}
   <div class="sb"><div class="no">No.${esc(d.no)}・${esc(d.date)}</div><h2>${esc(d.name)}</h2><button class="favbig${isFav(d)?" on":""}" id="favbig">${isFav(d)?"★ お気に入り":"☆ お気に入りに追加"}</button>
   <div class="meta" style="margin-bottom:8px"><span class="tag">${esc(d.type)}</span><span class="lv">${esc(d.level)}</span><span class="st st-${esc(eff(d))}">${esc(eff(d))}</span></div>
   ${actions(d)}${pat(d)}${r("構造",d.structure)}${r("寸法目安（推定）",d.size)}${r("革・仕様（想定）",d.spec)}${r("メモ",d.memo)}${r("出典",d.src)}${d.url?`<div class="row"><b>元の作品ページ</b><p><a href="${esc(d.url)}" target="_blank" rel="noopener" style="color:var(--brown)">写真を見る（外部サイト）</a></p></div>`:""}</div>`;
  document.getElementById("ov").classList.add("show");
  document.getElementById("sheet").scrollTop=0;
  document.getElementById("cl").onclick=close;
  bindActions(d);
  document.getElementById("favbig").onclick=()=>toggleFav(d.no);
}
function gallery(d){
  const ph=(d.photos||[]).map(u=>`<img src="${esc(u)}" alt="" referrerpolicy="no-referrer" loading="lazy" onerror="this.remove()">`).join("");
  const il=d.img?`<img src="${esc(d.img)}" alt="" class="ill">`:(d.photos&&d.photos.length?"":`<img src="img/${esc(d.no)}.jpg" alt="">`);
  if(!ph)return il||`<img src="img/${esc(d.no)}.jpg" alt="">`;
  return `<div class="gal">${ph}${il}</div><div class="galnote">写真${(d.photos||[]).length}枚：元の作品ページから表示（横にスワイプ）</div>`;
}
function pat(d){
  if(!d.pattern)return `<div class="row"><b>型紙</b><p>まだありません。☆お気に入りに入れたものから、定期更新で写真を見て優先して作ります。</p></div>`;
  const rows=(d.parts||[]).map(p=>`<tr><td>${esc(p[0])}</td><td>${esc(p[1])}</td><td>${esc(p[2])}</td><td>${esc(p[3])}</td></tr>`).join("");
  return `<div class="row"><b>型紙（寸法入り）</b><div class="pat"><img src="${esc(d.pattern)}" alt="型紙"><a href="${esc(d.pattern)}" target="_blank" rel="noopener">型紙を拡大して開く</a></div>
   ${rows?`<table class="parts"><tr><th>部品</th><th>寸法mm</th><th>枚数</th><th>革厚</th></tr>${rows}</table>`:""}
   ${d.patnote?`<p style="margin-top:8px">${esc(d.patnote)}</p>`:""}</div>`;
}
function close(){document.getElementById("ov").classList.remove("show");}
document.getElementById("ov").onclick=e=>{if(e.target.id==="ov")close();};
const DEF_WHY="これを1回やっておくと、ステータスも型紙修正もボタン1つでその場で反映されます。";
function openSetup(msg){const so=document.getElementById("setov");document.getElementById("setWhy").textContent=msg?DEF_WHY+msg:DEF_WHY;setUpd();so.classList.add("show")}
function setUpd(){document.getElementById("tokState").textContent=getTok()?"設定済み（ワンタップ更新ON）":"まだ設定されていません"}
async function saveTok(v){v=(v||"").trim();if(!/^(github_pat_|ghp_)/.test(v)){toast("github_pat_… の文字が見つかりません");return}
  try{localStorage.setItem(TKEY,v)}catch(e){toast("この端末に保存できませんでした");return}
  try{const j=await gh("");if(j.permissions&&j.permissions.push===false)throw new Error("leather-stockに書き込めません");
    toast("設定できました。もうボタン1つで反映されます");document.getElementById("setov").classList.remove("show");
    const o=document.getElementById("ov");if(o.classList.contains("show")){const no=(o.dataset.no||"");if(no)open(no)}render()}
  catch(e){try{localStorage.removeItem(TKEY)}catch(_){}toast("つながりませんでした。leather-stock を選んだか確認してね");}
  setUpd()}
(function(){const so=document.getElementById("setov");
 document.getElementById("gear").onclick=()=>openSetup("");
 document.getElementById("setClose").onclick=()=>so.classList.remove("show");
 so.onclick=e=>{if(e.target===so)so.classList.remove("show")};
 document.getElementById("tokPaste").onclick=async()=>{try{const t=await navigator.clipboard.readText();await saveTok(t)}catch(e){toast("貼り付けできませんでした。下の入力欄を使ってね");so.querySelector("details").open=true}};
 document.getElementById("tokSave").onclick=async()=>{const el=document.getElementById("tok");await saveTok(el.value);el.value=""};
 document.getElementById("tokDel").onclick=()=>{try{localStorage.removeItem(TKEY)}catch(e){};toast("削除しました");setUpd()};
})();
fetch("data.json",{cache:"no-cache"}).then(r=>r.json()).then(j=>{data=j;render();}).catch(()=>{document.getElementById("grid").innerHTML='<div class="empty">読み込めませんでした</div>';});
if("serviceWorker" in navigator && location.hostname.endsWith("github.io")){addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
