tart" dominant-baseline="middle" font-weight="400" font-family="sans-serif">本体Ø61は販売店の表記。作る前に紙テープで本体の周りを測り、測った周＋革厚×3.14を一周の長さにする</text><text x="-26.0" y="125.5" font-size="4.4" fill="#5b3a29" text-anchor="start" dominant-baseline="middle" font-weight="400" font-family="sans-serif">①を本体に巻いてホックで閉じる。外したハンドルのアームを①に沿わせ、②を上からかぶせて②の受けに留める</text><text x="-26.0" y="131.1" font-size="4.4" fill="#5b3a29" text-anchor="start" dominant-baseline="middle" font-weight="400" font-family="sans-serif">アームの厚み分（約8）、②は①に縫った所からホックまで余裕を持たせてある</text><text x="-26.7" y="203.7" font-size="6.4" fill="#8a7a6d" font-family="sans-serif">C40用 ハンドルを横に留めるミルカバー（バンド＋ハンドル押さえ）</text><text x="-26.7" y="213.3" font-size="5.9" fill="#8a7a6d" font-family="sans-serif">単位mm／実線＝裁ち線／赤点線＝折り線／黒の細点線＝縫い線／○＝金具位置／寸法は推定</text></svg>