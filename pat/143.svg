y="sans-serif">ホック頭</text><text x="-26.0" y="190.0" font-size="4.1" fill="#5b3a29" text-anchor="start" dominant-baseline="middle" font-weight="400" font-family="sans-serif">本体Ø61は販売店の表記。作る前に紙テープで本体の周りを測り、測った周＋革厚×3.14を一周の長さにする</text><text x="-26.0" y="195.2" font-size="4.1" fill="#5b3a29" text-anchor="start" dominant-baseline="middle" font-weight="400" font-family="sans-serif">①②は端を10重ねて縫い筒に（重ねる側を漉く）。内側の金属に当たる所に薄い布を貼る</text><text x="-26.0" y="200.4" font-size="4.1" fill="#5b3a29" text-anchor="start" dominant-baseline="middle" font-weight="400" font-family="sans-serif">③は①の背中側にリベットで留め、下へ伸ばして②のホック受けに。外すと指を通すループになる</text><text x="-25.0" y="271.0" font-size="6.0" fill="#8a7a6d" font-family="sans-serif">C40用 カバー＋グリップベルト（本体・ジャーの2ピース）</text><text x="-25.0" y="280.0" font-size="5.5" fill="#8a7a6d" font-family="sans-serif">単位mm／実線＝裁ち線／赤点線＝折り線／黒の細点線＝縫い線／○＝金具位置／寸法は推定</text></svg>