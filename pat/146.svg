<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30.0 -30.0 360.0 216.0" width="360" height="216"><rect x="-30.0" y="-30.0" width="360.0" height="216.0" fill="#fffdf9"/><path d="M0,20 L214,20 A20,20 0 0 1 214,60 L0,60 Z" fill="#f3e6d6" stroke="#2b211b" stroke-width="0.80" stroke-linejoin="round"/><circle cx="10" cy="40" r="2.5" fill="#fff" stroke="#2b211b" stroke-width="0.50"/><circle cx="220" cy="40" r="2.5" fill="#fff" stroke="#2b211b" stroke-width="0.50"/><text x="10.0" y="70.0" font-size="3.1" fill="#8a7a6d" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-family="sans-serif">受け</text><text x="220.0" y="70.0" font-size="3.1" fill="#8a7a6d" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-family="sans-serif">頭</text><text x="117.0" y="40.0" font-size="4.9" fill="#5b3a29" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-family="sans-serif">グリップ（本体に一周＋アーム分16＋重ね20）</text><line x1="0.0" y1="20.0" x2="0.0" y2="8.0" stroke="#2f5d8a" stroke-width="0.27"/><line x1="234.0" y1="20.0" x2="234.0" y2="8.0" stroke="#2f5d8a" stroke-width="0.27"/><line x1="0.0" y1="10.0" x2="234.0" y2="10.0" stroke="#2f5d8a" stroke-width="0.45"/><path d="M0.0,10.0 L3.5,11.2 L3.5,8.8 Z" fill="#2f5d8a"/><path d="M234.0,10.0 L230.5,11.2 L230.5,8.8 Z" fill="#2f5d8a"/><text x="117.0" y="5.5" font-size="7.0" fill="#2f5d8a" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-weight="700" transform="rotate(0.0 117.0 5.5)" paint-order="stroke" stroke="#fff" stroke-width="1.5">234</text><line x1="234.0" y1="20.0" x2="248.0" y2="20.0" stroke="#2f5d8a" stroke-width="0.27"/><line x1="234.0" y1="60.0" x2="248.0" y2="60.0" stroke="#2f5d8a" stroke-width="0.27"/><line x1="246.0" y1="20.0" x2="246.0" y2="60.0" stroke="#2f5d8a" stroke-width="0.45"/><path d="M246.0,20.0 L244.8,23.5 L247.2,23.5 Z" fill="#2f5d8a"/><path d="M246.0,60.0 L244.8,56.5 L247.2,56.5 Z" fill="#2f5d8a"/><text x="250.5" y="40.0" font-size="7.0" fill="#2f5d8a" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-weight="700" transform="rotate(90.0 250.5 40.0)" paint-order="stroke" stroke="#fff" stroke-width="1.5">40</text><text x="-26.0" y="95.0" font-size="4.1" fill="#5b3a29" text-anchor="start" dominant-baseline="middle" font-weight="400" font-family="sans-serif">本体Ø61は販売店の表記。作る前に紙テープで本体の周りを測り、測った周＋革厚×3.14を一周の長さにする</text><text x="-26.0" y="100.2" font-size="4.1" fill="#5b3a29" text-anchor="start" dominant-baseline="middle" font-weight="400" font-family="sans-serif">外したハンドルのアームを本体に当て、その上から巻いてボタンで留める。使うときはアームなしで巻くと少し余るので、受けを2個（端から10と26）付けてもいい</text><text x="-26.0" y="105.4" font-size="4.1" fill="#5b3a29" text-anchor="start" dominant-baseline="middle" font-weight="400" font-family="sans-serif">最初は少しきつめ（革が伸びる）。裏の床面はトコノールで磨かずにザラつかせると滑り止めになる</text><text x="-25.0" y="171.0" font-size="6.0" fill="#8a7a6d" font-family="sans-serif">C40用 ボタン留めのグリップ（ハンドルもまとめられる）</text><text x="-25.0" y="180.0" font-size="5.5" fill="#8a7a6d" font-family="sans-serif">単位mm／実線＝裁ち線／赤点線＝折り線／黒の細点線＝縫い線／○＝金具位置／寸法は推定</text></svg>